name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: script
      run: |
        sudo apt update
        sudo apt install gnulib
        gnulib-tool --version
        cd hello-c-gnulib
        export GNULIB_SRCDIR=/usr/share/gnulib
        ./autogen.sh
        ./configure
        cd ../hello-c-gnulib-automakesubdir
        ./autogen.sh
        ./configure
        cd ../hello-c-gnulib-automakesubdir-withtests
        ./autogen.sh
        ./configure
        cd ../hello-c-gnulib-conddeps
        ./autogen.sh
        ./configure
        cd ../hello-c-gnulib-nonrecursive
        ./autogen.sh
        ./configure
        cd ../hello-c-nognulib
        ./autogen.sh
        ./configure

    - name: make
      run: |
        cd hello-c-gnulib
        make
        cd ../hello-c-gnulib-automakesubdir
        make
        cd ../hello-c-gnulib-automakesubdir-withtests
        make
        cd ../hello-c-gnulib-conddeps
        make
        cd ../hello-c-gnulib-nonrecursive
        make
        cd ../hello-c-nognulib
        make
